openapi: 3.1.0
info:
  title: Talewick Independent Reviews API
  version: 1.4.0
  description: >-
    Local-only durable tasks for isolated whole-manuscript reading and trusted
    baseline/candidate comparison. Completion means records were saved; it is
    not a literary, publication, or automatic adoption decision.
servers:
  - url: http://127.0.0.1:4326
paths:
  /api/independent-reviews:
    get:
      summary: List review attempts for a project
      parameters:
        - in: query
          name: projectId
          schema: { type: string, pattern: '^[\w-]{1,160}$' }
      responses:
        '200':
          description: Service capability and newest-first task history
          content:
            application/json:
              schema:
                type: object
                required: [available, tasks]
                properties:
                  available: { type: boolean }
                  versions: { type: [object, 'null'], additionalProperties: true }
                  readingFocusVersions: { type: array, items: { type: string } }
                  modelCitationModes:
                    description: Explicit supported modes for new tasks. An empty or absent array never implies support.
                    type: array
                    items: { type: string, enum: [paragraph_refs_v1] }
                  tasks: { type: array, items: { $ref: '#/components/schemas/ReviewTask' } }
    post:
      summary: Create or idempotently recover an independent review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReview' }
      responses:
        '202':
          description: Accepted or existing identical task
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties: { task: { $ref: '#/components/schemas/ReviewTask' } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/independent-reviews/{id}:
    get:
      summary: Read one public task snapshot
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: Task snapshot without local paths, frozen private bindings, or provider result internals
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties: { task: { $ref: '#/components/schemas/ReviewTask' } }
        '404': { $ref: '#/components/responses/Error' }
  /api/independent-reviews/{id}/cancel:
    post:
      summary: Cancel active work while retaining sealed records
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '200':
          description: Cancelled or already terminal task
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties: { task: { $ref: '#/components/schemas/ReviewTask' } }
  /api/independent-reviews/{id}/retry:
    post:
      summary: Resume a sealed interrupted run or create a linked attempt
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '202':
          description: Resumed task or new linked attempt
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties: { task: { $ref: '#/components/schemas/ReviewTask' } }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/independent-reviews/{id}/retry-invalid-reading:
    post:
      summary: Explicitly reread one strictly rejected independent-reading stage once
      description: >-
        Uses the same saved task and frozen input. The server inspects eligibility
        and obtains inspectionHash; clients cannot supply model inputs or corrections.
        Prior opinions and failed attempts remain. Only a valid new seal permits
        continuation of later stages. Failure or an unknown outcome is never resent.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, stageId]
              properties:
                requestId: { type: string, pattern: '^[\w-]{1,160}$' }
                stageId: { type: string, pattern: '^[\w-]{1,160}$' }
      responses:
        '202':
          description: Same task queued or existing identical operation returned
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties: { task: { $ref: '#/components/schemas/ReviewTask' } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/independent-reviews/{id}/evidence-audits:
    get:
      summary: Read separate evidence audits and server-verified source eligibility
      description: >-
        Read-only strict replay of each saved input and normalization proof, bound
        to the current frozen source snapshot. Legacy inputs retain their original
        version and omission. Original seven-stage opinions and statuses are unchanged. The endpoint merges the legacy store with the separate bound-review-evidence-audit-product-1 store. Server-only proof, full transport packets and raw responses are never returned.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: Capability, eligibility and independently replayed audit history
          content:
            application/json:
              schema:
                type: object
                required: [available, eligible, tasks]
                properties:
                  available: { type: boolean }
                  eligible: { type: boolean }
                  reason: { type: [string, 'null'] }
                  versions: { type: [object, 'null'], description: Server-selected canonical policy plus execution service/bound protocol. New execution uses bound-review-evidence-audit-product-1 and review-evidence-audit-claim-bound-3. Historical task policies remain in their saved records. }
                  tasks: { type: array, items: { $ref: '#/components/schemas/EvidenceAuditTask' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Explicitly submit one isolated evidence audit of a saved complete review
      description: >-
        Only complete seven-stage six-focus paragraph-reference comparisons qualify.
        Server derives all text, hashes, paths and targets. New sources use the fixed
        bound3 complete-audit registration with event2 and complete-premise-coverage
        guards. Every registered batch has at most two targets, a fresh context,
        allowRecovery:false, separately retained raw/receipt/seal and no retry.
        Complete evidence review requires canonical, event and coverage gates.
        Existing records in either namespace are returned even with a new requestId;
        legacy successes, failures and unknown outcomes are never upgraded by a click.
        Unavailable legacy files block new dispatch. No fallback to single-dispatch.
        The browser cannot select policy, batches, sources or submit proof/results.
        No model format repair, blind vote, automatic adoption or source-task mutation.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: { type: string, pattern: '^[\w-]{1,160}$' }
      responses:
        '202':
          description: Separate queued audit or existing identical frozen-input audit
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties: { task: { $ref: '#/components/schemas/EvidenceAuditTask' } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  parameters:
    TaskId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Request rejected without changing the manuscript
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties: { error: { type: string } }
  schemas:
    ReviewSourceBinding:
      type: object
      readOnly: true
      additionalProperties: false
      required: [schemaVersion, reviewTaskId, requestHash, sourceReportSha256]
      properties:
        schemaVersion: { const: product-review-source-binding-1 }
        reviewTaskId: { type: string }
        requestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        sourceReportSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      description: Read-only identity derived from the saved source report before public redaction. It is not a check result or a writable request option.
    EvidenceAuditTask:
      type: object
      required: [id, projectId, sourceReviewTaskId, status, automaticAdoption, literaryPass, originalReviewUnchanged]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{64}$' }
        projectId: { type: string }
        sourceReviewTaskId: { type: string }
        status: { type: string, enum: [queued, running, complete, needs_attention, interrupted, cancelled] }
        executionVersion: { type: string, readOnly: true, description: Native bound transport used for this record; omitted in historical single-dispatch records. }
        progress: { type: object, readOnly: true, description: "Total registered batches, settled batches and batches needing review; settlement is not semantic accuracy." }
        batches: { type: array, readOnly: true, items: { type: object }, description: "Public batch status/error only; no decoded packets, raw responses or proof." }
        createdAt: { type: string }
        updatedAt: { type: string }
        formatNormalizationVersion: { const: citation-check-reason-alias-1, description: Server-frozen option; omitted in legacy records. }
        auditPolicyVersion: { type: string, enum: [original-citation-and-whole-text-1, fact-subclaims-and-two-axes-2, fact-premise-decomposition-and-two-axes-3], description: Server-frozen audit method; omission in legacy records means v1. Never a browser request selector. }
        report: { type: [object, 'null'], description: Strict runner replay; v3 includes premiseChecks for five fact-premise dimensions. not_applicable is not factual verification. Evidence classification is not literary approval. }
        canonicalAuditComplete: { type: boolean, readOnly: true, description: All registered batches passed canonical replay; does not mean the event gate passed. }
        completeEvidenceReview: { type: boolean, readOnly: true, description: "Exact assembled flag; false when any canonical, event or premise-coverage gate is incomplete or needs review. Never literary approval." }
        semanticAccuracyProven: { const: false, readOnly: true }
        eventGroundingPolicyVersion: { type: string, enum: [event-state-and-time-grounding-1, event-state-and-time-grounding-2], readOnly: true }
        eventGrounding:
          type: object
          readOnly: true
          description: >-
            Optional product-event-grounding-projection-1 (legacy) or -2 from the explicitly opted-in
            host integration helper, replaying every original batch through
            assembleBoundReviewEvidenceAudit. Includes registrationHash, complete coverage,
            canonicalAuditComplete, eventGroundingPassed, completeEvidenceReview, unchanged
            target and assessment proof hashes from event-state-and-time-grounding-1. Bound to ReviewSourceBinding.
            needs_review is not completed evidence verification. structurally_consistent
            is not semantic truth or literary approval. Projection -2 declares premiseCoverageRequired,
            premiseCoverageGates, premiseCoveragePassed and premiseCoverageBinding (policy/tool,
            audit request and whole coverage input hashes); required missing coverage remains
            needs_attention. Full completion requires canonical, event and coverage gates.
            Legacy bound2 does not require coverage. Legacy event absence means not checked.
            This field is derived only from server-verified proof and cannot be supplied
            by a browser. Original review and audit records remain unchanged.
        error: { type: [object, 'null'] }
        automaticAdoption: { const: false }
        literaryPass: { const: NOT_COMPUTED }
        originalReviewUnchanged: { const: true }
    Chapter:
      type: object
      additionalProperties: false
      required: [id, title, body]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string }
        body: { type: string, minLength: 1, maxLength: 100000 }
    CreateReview:
      type: object
      additionalProperties: false
      required: [projectId, requestId, manuscriptRevision, title, chapters, mode]
      dependentSchemas:
        modelCitationMode:
          required: [readingFocusVersion]
          properties:
            readingFocusVersion: { const: literary-reading-six-1 }
      properties:
        projectId: { type: string, pattern: '^[\w-]{1,160}$' }
        requestId: { type: string, pattern: '^[\w-]{1,160}$' }
        caseId: { type: string, pattern: '^[\w-]{1,160}$' }
        manuscriptRevision: { type: string, maxLength: 256 }
        title: { type: string, maxLength: 2000 }
        chapters: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/Chapter' } }
        mode: { type: string, enum: [single, compare] }
        readingFocusVersion: { type: string, enum: [literary-reading-six-1] }
        readingFocusDefinitions:
          description: Optional exact server definitions; callers normally omit these.
          type: array
          items: { type: object }
        modelCitationMode:
          type: string
          enum: [paragraph_refs_v1]
          description: >-
            Opt in only for a new six-focus review. Frozen in submission/task and
            adapter metadata and bound by their hashes. Omission preserves the
            original citation mode. Resume/recovery cannot change this field.
        sourceTaskId:
          type: string
          description: Required for compare; identifies a server-saved whole-manuscript-v2 result. Candidate text and goals are never accepted from the browser.
        selection:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: '^[\w-]{1,160}$' }
    Progress:
      type: object
      required: [phase, completedStages, totalStages]
      properties:
        phase: { type: string }
        completedStages: { type: integer, minimum: 0 }
        totalStages: { type: integer, minimum: 0 }
    ReviewTask:
      type: object
      required: [id, projectId, requestId, caseId, mode, status, manuscriptRevision, createdAt, updatedAt, progress, report, error]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string }
        requestId: { type: string }
        caseId: { type: string }
        mode: { type: string, enum: [single, compare] }
        sourceTaskId: { type: string }
        readingFocusVersion: { type: string }
        modelCitationMode: { type: string, enum: [paragraph_refs_v1] }
        reviewSourceBinding: { $ref: '#/components/schemas/ReviewSourceBinding' }
        anonymousComparison:
          type: object
          readOnly: true
          description: Optional product-anonymous-comparison-1 display binding from trusted import/preview assembly. Contains only source identity, registration/shared-input SHA and A/B manuscript SHA; never model names or a writer map. Not accepted by CreateReview.
        linkedAttemptId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, complete, interrupted, cancelled, needs_attention, stale] }
        manuscriptRevision: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        progress: { $ref: '#/components/schemas/Progress' }
        invalidReadingRetry:
          description: Read-only runtime inspection; omission is unavailable, never implicit eligibility.
          type: object
          required: [available, eligible, remainingAttempts]
          properties:
            available: { type: boolean }
            eligible: { type: boolean }
            remainingAttempts: { type: integer, enum: [0, 1] }
            stageId: { type: string }
            reason: { type: string }
        invalidReadingRetries:
          description: Separate once-only reread history; never described as restoring the old opinion.
          type: array
          items:
            type: object
            required: [requestId, stageId, status]
            properties:
              requestId: { type: string }
              stageId: { type: string }
              status: { type: string }
              originalError: { type: [object, 'null'], additionalProperties: true }
        report:
          description: Validation adapter's JSON-serializable public report. It never authorizes automatic adoption.
          type: [object, 'null']
          additionalProperties: true
        error:
          type: [object, 'null']
          properties:
            code: { type: string }
            message: { type: string }
            recoverable: { type: boolean }
